[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeagent"
version = "0.1.0"
description = "An OpenAI-compatible coding agent with tools, memory, skills, and sub-agents"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ForgeAgent Contributors" }]
keywords = ["agent", "coding", "cli", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "jsonschema>=4.26.0",
    "mcp>=1.27.0",
    "openai>=1.0",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.2.2",
    "rich>=13.0",
    "tiktoken>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["forgeagent"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
forgeagent = "forgeagent.interface.repl:main"
