[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgecc"
version = "0.1.0"
description = "A from-scratch Python reconstruction of the Claude Code agent architecture"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ForgeCC Contributors" }]
keywords = ["agent", "coding", "cli", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["forgecc"]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
forgecc = "forgecc.interface.repl:main"
